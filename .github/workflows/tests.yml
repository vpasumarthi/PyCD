name: Tests and dependency compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check certifi bundle and pylint installation
        run: |
          python -c "import ssl, certifi; context = ssl.create_default_context(cafile=certifi.where()); assert context.get_ca_certs()"
          python -m pylint --version
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q PyCD/tests
